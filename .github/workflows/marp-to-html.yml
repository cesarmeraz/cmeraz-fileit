name: Deploy Marp Slides to GitHub Pages

on:
  push:
    branches:
      - develop # Or your default branch name
  workflow_dispatch: # Allows manual triggering from the Actions tab

# Set permissions required for secure GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments from colliding
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Assets (Optional)
        run: |
          mkdir -p build
          # If you have an images folder, uncomment the line below:
          # cp -r images build/ 

      - name: Convert Markdown to Marp HTML
        uses: KoharaKazuya/marp-cli-action@v4
        with:
          # Use repository Marp configuration
          config-file: .marprc.yml

      - name: Fix Index File (Optional)
        run: |
          # index.html is generated directly by marp-cli via .marprc.yml
          test -f build/index.html
          ls -lah build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
